name: Filesystem safety gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fs-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib binutils python3 dosfstools exfatprogs mtools ntfs-3g
      - name: Run full software gate
        run: python3 tools/check_filesystems.py
      - name: Upload results even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filesystem-safety-results
          path: build/fs-check/
