# vm2 studios | t.me/v2vproj - MultiOS / MultiPulti
# MultiOS 0.6-cpu. ASCII key=value, case-sensitive, no inline comments.
# Only IDs compiled into BOOTX64.EFI can be selected here.
output=uefi-text
input=uefi-keys
block=uefi-file
block.options=\MULTIOS\DATA.IMG
power=uefi-reset
osk=auto
# To force read-only: replace block=uefi-file with block=uefi-file-ro
# To disable firmware ResetSystem: replace power=uefi-reset with power=uefi-no-reset
# osk=on / off / auto (auto uses OSK.ON)
